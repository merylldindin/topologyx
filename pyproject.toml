[project]
name = "topologyx"
version = "1.3.0"
description = "Topology data analysis routines"
authors = [{ name = "Meryll Dindin", email = "merylldin@gmail.com" }]
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.13,<3.15"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
dependencies = [
    "gudhi==3.13.0",
    "jax==0.12.0.1; sys_platform != 'darwin' or platform_machine != 'x86_64'",
    "keras==3.15.1",
    "matplotlib==3.11.2",
    "numpy==2.5.4",
    "scikit-learn==1.9.1",
]

[project.scripts]
topologyx = "topologyx.main:cli"

[project.urls]
Homepage = "https://github.com/merylldindin/topologyx"
Repository = "https://github.com/merylldindin/topologyx"

[dependency-groups]
dev = [
    "commitizen==4.19.3",
    "pre-commit==4.7.0",
    "pytest==9.1.1",
    "pytest-cov==7.1.0",
    "ruff==0.17.2",
    "ty==0.0.91",
    "marimo==0.25.2",
]

[build-system]
requires = ["hatchling==1.32.4"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/topologyx"]

[tool.ruff]
line-length = 88
output-format = "grouped"
show-fixes = true

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
docstring-code-format = true

[tool.ruff.lint]
dummy-variable-rgx = "_+$|(_[a-zA-Z0-9_]*[a-zA-Z0-9]+?$)|dummy|^ignored_|^unused_"
ignore = ["E402", "E501"]
select = ["E", "F", "I001", "W"]

[tool.ty.src]
include = ["src/topologyx", "tests"]

[tool.ty.rules]
unresolved-import = "warn"
unresolved-attribute = "warn"

[tool.ty.terminal]
error-on-warning = false

[tool.pytest.ini_options]
addopts = "--no-header -rA"
