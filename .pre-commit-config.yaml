default_install_hook_types: [pre-commit, commit-msg]

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
        name: Trailing Whitespace
        stages: [pre-commit]
      - id: end-of-file-fixer
        name: End of File
        stages: [pre-commit]
      - id: check-yaml
        name: YAML Syntax
        stages: [pre-commit]
      - id: check-toml
        name: TOML Syntax
        stages: [pre-commit]

  - repo: local
    hooks:
      - id: ruff-format
        name: Python Format
        entry: uv run --frozen ruff format --force-exclude
        language: system
        types_or: [python, pyi, jupyter, markdown]
        require_serial: true
        stages: [pre-commit]
      - id: ruff
        name: Python Lint
        entry: uv run --frozen ruff check --force-exclude --fix
        language: system
        types_or: [python, pyi, jupyter]
        require_serial: true
        stages: [pre-commit]
      - id: commitizen
        name: Commit Linter
        entry: uv run --frozen cz check --allow-abort --commit-msg-file
        language: system
        stages: [commit-msg]
